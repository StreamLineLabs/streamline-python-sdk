[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testcontainers-streamline"
version = "0.2.0"
description = "Testcontainers module for Streamline - The Redis of Streaming"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Streamline Authors", email = "team@streamlinelabs.dev" }
]
keywords = ["streamline", "kafka", "testcontainers", "testing", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9,<3.15"
dependencies = [
    "testcontainers>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "kafka-python>=2.0.0",
    "requests>=2.28.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/streamlinelabs/streamline-python-sdk"
Documentation = "https://github.com/streamlinelabs/streamline-python-sdk/tree/main/testcontainers"
Repository = "https://github.com/streamlinelabs/streamline-python-sdk"
Issues = "https://github.com/streamlinelabs/streamline-python-sdk/issues"

[tool.setuptools.packages.find]
include = ["streamline_testcontainers*"]
