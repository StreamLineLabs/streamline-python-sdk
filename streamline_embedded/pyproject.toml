[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "streamline-embedded"
version = "0.4.0"
description = "Experimental Python binding scaffold for Embedded Streamline"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9,<3.15"
authors = [
    { name = "Streamline Authors", email = "team@streamlinelabs.dev" }
]
keywords = ["streamline", "streaming", "embedded", "pyo3", "rust"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/streamlinelabs/streamline-python-sdk"
Documentation = "https://github.com/streamlinelabs/streamline-python-sdk/tree/main/streamline_embedded"
Repository = "https://github.com/streamlinelabs/streamline-python-sdk"
Issues = "https://github.com/streamlinelabs/streamline-python-sdk/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "streamline_embedded"
