# Dependabot configuration — StreamlineLabs
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5

  # pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10

  # Nested Testcontainers Python distribution
  - package-ecosystem: "pip"
    directory: "/testcontainers"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      testcontainers-python:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(testcontainers-deps):"
    open-pull-requests-limit: 5

  # Embedded Python extension Rust crate
  - package-ecosystem: "cargo"
    directory: "/streamline_embedded"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      embedded-rust:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(embedded-deps):"
    open-pull-requests-limit: 5

  # Embedded extension Python build dependencies
  - package-ecosystem: "pip"
    directory: "/streamline_embedded"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      embedded-python:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(embedded-python-deps):"
    open-pull-requests-limit: 5
