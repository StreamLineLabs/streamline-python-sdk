name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"
      - run: pytest tests/

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python -m compileall -q examples

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

  testcontainers-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: testcontainers/pyproject.toml

      - run: pip install -e "testcontainers[dev]"
      - run: pytest testcontainers/tests/
      - run: python -m build testcontainers
      - run: twine check testcontainers/dist/*

  embedded-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - run: pip install maturin twine
      - run: cargo test --manifest-path streamline_embedded/Cargo.toml
      - run: >-
          cargo package --manifest-path streamline_embedded/Cargo.toml
          --allow-dirty --no-verify
      - run: >-
          maturin build --release
          --manifest-path streamline_embedded/Cargo.toml
      - run: twine check streamline_embedded/target/wheels/*
