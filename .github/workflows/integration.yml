name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 4am UTC
  workflow_dispatch:
    inputs:
      image:
        description: Immutable Streamline image reference (repository@sha256:<64 lowercase hex>)
        required: false
        type: string

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Require an explicit immutable image digest
        id: resolve
        env:
          IMAGE: ${{ inputs.image || vars.STREAMLINE_CONFORMANCE_IMAGE }}
        run: |
          if ! [[ "$IMAGE" =~ ^[^[:space:]@:]+(:[0-9]+)?(/[^[:space:]@:]+)+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Set STREAMLINE_CONFORMANCE_IMAGE, or the workflow image input, to repository@sha256:<64 lowercase hex>." >&2
            echo "::error::Missing images, mutable tags, tag-plus-digest aliases, and malformed digests are hard-blocked." >&2
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  integration:
    needs: resolve-image
    runs-on: ubuntu-latest
    services:
      streamline:
        image: ${{ needs.resolve-image.outputs.image }}
        ports:
          - 9092:9092
          - 9094:9094
        options: >-
          --health-cmd "curl -f http://localhost:9094/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]" kafka-python pytest-timeout
      - name: Wait for Streamline
        run: |
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9094/health; then
              ready=1
              break
            fi
            echo "Waiting for Streamline... ($i/30)"
            sleep 2
          done
          test "$ready" -eq 1
      - name: Run integration tests
        run: pytest tests/ -v -m integration --timeout=60
        env:
          STREAMLINE_INTEGRATION: '1'
          STREAMLINE_BOOTSTRAP_SERVERS: localhost:9092
          STREAMLINE_BOOTSTRAP: localhost:9092
          STREAMLINE_HTTP_URL: http://localhost:9094

  conformance:
    needs: resolve-image
    runs-on: ubuntu-latest
    services:
      streamline:
        image: ${{ needs.resolve-image.outputs.image }}
        ports:
          - 9092:9092
          - 9094:9094
        options: >-
          --health-cmd "curl -f http://localhost:9094/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run required conformance suite
        run: >-
          pytest tests/conformance -v -m conformance --strict-markers
          --timeout=60 -rs
        env:
          CONFORMANCE: '1'
          STREAMLINE_REQUIRE_CONFORMANCE: '1'
          STREAMLINE_BOOTSTRAP_SERVERS: localhost:9092
          STREAMLINE_BOOTSTRAP: localhost:9092
          STREAMLINE_HTTP_URL: http://localhost:9094
